<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal and Image Entry Application</title>
</head>
<body>
    <header>
        <h1>Welcome to the Journal and Image Entry Application</h1>
    </header>
    <main>
        <section>
            <h2>Journal Entries</h2>
            <p>Here you can write your journal entries for the day.</p>
            <textarea placeholder="Write your journal entry here..."></textarea>
        </section>
        <section>
            <h2>Image Upload</h2>
            <p>Upload your images to share with your journal entries.</p>
            <input type="file" accept="image/*">
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Journal and Image Entry App</p>
    </footer>
</body>
</html>
