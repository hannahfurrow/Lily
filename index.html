<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lily - Journal & Image Entries</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap" rel="stylesheet">

    <script>
        const password = prompt("Enter the password:");
        if (password !== "poopytamale") {
            window.location.href = "about:blank";
        }
    </script>
</head>
    
<body>
    <div class="journal">
        <h1>Lily</h1>

        <div class="polaroid">
            <img src="front-page.jpg" alt="Lily">
            <p class="caption">H + L</p>
        </div>

        <div class="container">
            <header class="header">
                <div class="header-content">
                    <h1 class="app-title">My Love</h1>
                    <p class="app-subtitle">For centuries, humans have shaped language—just so that one day I could write to you.</p>
                </div>
            </header>

            <main class="main-content">
            <section class="sidebar">

<div class="journal-layout">

    <div class="journal-index">
        <h3>Journal Index</h3>
        <ul id="indexList"></ul>
    </div>

    <div class="journal-book">
        <div class="journal-page" id="journalPage">
            <h2 id="pageTitle"></h2>
            <p id="pageDate" class="page-date"></p>
            <img id="pageImage" class="page-image" src="" alt="" style="display:none;">
            <p id="pageText" class="page-text"></p>
        </div>

        <div class="page-controls">
            <button id="prevBtn">Previous</button>
            <span id="pageNumber"></span>
            <button id="nextBtn">Next</button>
        </div>
    </div>

</div>

</section>
            </main>
        </div>

        <div id="entryModal" class="modal">
            <div class="modal-content">
                <span class="modal-close">&times;</span>
                <div id="modalBody"></div>
            </div>
        </div>
    </div>

    <script src="entries.js"></script>
    <script src="app.js"></script>

<!-- Music Player -->
<div class="music-player">

    <div class="record-player">
        <div class="vinyl" id="vinyl"></div>
        <button class="music-btn" onclick="toggleMusic()">Play Music</button>
    </div>

    <p class="song-label">Our Song</p>

    <audio id="bgmusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

</div>


</div>
    
</body>
</html>
